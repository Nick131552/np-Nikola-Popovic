[project]
name = "np-nikola-popovic"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["Nedelja1", "Nedelja2"]
extend-exclude = ["**/Materijal"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
python_files = ["test_*.py", "nedelja*.py"]
